<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172323">
  <meta name="description" content="Check-list d'écoute sur différents systèmes.">
  <title>Check-list d'écoute</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Aller au contenu</a>
  <header class="topbar">
    <div class="topbar-inner">
      <button id="back-btn" class="icon-btn back-btn" type="button" aria-label="Étape précédente" title="Étape précédente" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 5-7 7 7 7"/></svg>
      </button>
      <div class="topbar-title">Check-list d'écoute<span class="dirty-indicator" id="dirty-indicator" aria-label="Modifications non enregistrées" title="Modifications non enregistrées" hidden></span></div>
      <button id="menu-btn" class="icon-btn menu-btn" type="button" aria-label="Ouvrir le menu" aria-controls="menu-panel" aria-expanded="false" title="Menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <nav id="menu-panel" class="menu-panel" aria-label="Gestion du projet" hidden>
        <div class="menu-heading">Mon projet</div>
        <button type="button" data-menu-action="save">Enregistrer dans ce navigateur</button>
        <button type="button" data-menu-action="export">Exporter le projet <span>JSON</span></button>
        <button type="button" data-menu-action="import">Charger un projet <span>JSON</span></button>
        <button type="button" data-menu-action="pdf">Exporter le rapport <span>PDF</span></button>
        <div class="menu-divider"></div>
        <button type="button" data-menu-action="contexts">Changer de système</button>
        <button type="button" data-menu-action="songs">Choisir un morceau</button>
        <button type="button" data-menu-action="reset" class="menu-danger">Effacer les données locales</button>
      </nav>
    </div>
  </header>
  <main id="main" class="main" tabindex="-1">
    <div class="step-line"><span id="step-label">01 / 04</span><span id="saved-label"></span></div>
    <div class="steps" aria-label="Progression du parcours"><span class="step-on"></span><span></span><span></span><span></span></div>
    <div id="screen" aria-live="off"></div>
  </main>
  <div class="backdrop" id="menu-backdrop" hidden></div>
  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="unsaved-dialog" class="confirm-dialog" aria-labelledby="unsaved-title">
    <h2 id="unsaved-title">Modifications non enregistrées</h2>
    <p>Tu as modifié cette écoute. Veux-tu l'enregistrer avant de partir ?</p>
    <div class="dialog-actions">
      <button type="button" data-dialog="save" class="btn btn-primary">Enregistrer et continuer</button>
      <button type="button" data-dialog="discard" class="btn btn-outline">Continuer sans enregistrer</button>
      <button type="button" data-dialog="cancel" class="btn btn-text">Annuler</button>
    </div>
  </dialog>
</body>
</html>
